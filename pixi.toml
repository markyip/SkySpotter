[workspace]
name = "skyspotter"
version = "2.3.0"
description = "SkySpotter - Aviation Specialist Image Viewer"
authors = ["Mark Yip"]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "osx-64"]

# pyexiv2 arm64 wheels target macOS 14+ (macosx_14_0_arm64); Intel wheels use macosx_13_0_x86_64.
[system-requirements]
macos = "14.0"

[tasks]
start = "python src/main.py"
start-windowless = "pythonw src/main.py"
start-experimental = "python src/main.py"
setup = "python scripts/pixi_setup.py"
fix-opencv = "python scripts/pixi_fix_opencv.py"
setup-torch = "python scripts/pixi_setup_classifier_torch.py"
batch-test-classifier = "python scripts/batch_test_classifier.py"
verify-model = "python scripts/batch_test_classifier.py"
test-aircraft-model = "python scripts/batch_test_classifier.py"
train-model = "python scripts/train_processed_aircraft.py"
export-classifier-onnx = "python scripts/export_classifier_onnx.py"
benchmark-classifier = "python scripts/benchmark_classifier_paths.py"
poc-blur-compare-modes = "python scripts/poc_blur_compare_modes.py"
poc-blur-compare-sizes = "python scripts/poc_blur_compare_sizes.py"
set-features-off = "python scripts/set_features.py --blur-score off"
set-features-experimental = "python scripts/set_features.py --copy-experimental"
features-show = "python scripts/set_features.py --show"

[feature.dev-ml]
platforms = ["win-64"]

[feature.dev-ml.pypi-dependencies]
onnxscript = "*"
torchvision = "*"
tqdm = "*"

[feature.semantic-search]
platforms = ["win-64"]

[feature.semantic-search.pypi-dependencies]
tokenizers = "*"
sentencepiece = "*"

[environments]
default = { features = [], solve-group = "default" }
dev-ml = { features = ["dev-ml"], solve-group = "default" }
semantic = { features = ["semantic-search"], solve-group = "default" }
full = { features = ["dev-ml", "semantic-search"], solve-group = "default" }

[activation.env]
PYTHONNOUSERSITE = "1"
SkySpotter_FEATURES_FILE = "config/skyspotter_features.json"
RAWVIEWER_GPU_VIEW = "1"

[dependencies]
python = ">=3.10,<3.13"
pip = "*"

[pypi-dependencies]
PyQt6 = ">=6.6.0"
rawpy = ">=0.25.0"
numpy = ">=2.0.0,<=2.3"
Pillow = ">=10.0.0"
send2trash = ">=1.8.0"
natsort = ">=8.4.0"
exifread = ">=3.0.0"
psutil = ">=5.9.0"
pyqtgraph = ">=0.13.0"
qtawesome = ">=1.2.0"
pycountry = "*"
reverse-geocoder = "*"
onnxruntime-directml = ">=1.18.0"
pyexiv2 = "*"
pywin32 = "*"
comtypes = "*"
"winrt-Windows.ApplicationModel.DataTransfer" = "*"
"winrt-Windows.Storage" = "*"
opencv-contrib-python = "*"
huggingface_hub = "*"
requests = "*"
rembg = "*"
scikit-image = "*"
torch = "*"
torchvision = "*"
transformers = "*"

# macOS EXIF (Exiv2). After `pixi install`, ensure native libs: brew install inih gettext
[target.osx-arm64.pypi-dependencies]
pyexiv2 = ">=2.15.4"

[target.osx-64.pypi-dependencies]
pyexiv2 = ">=2.15.4"

